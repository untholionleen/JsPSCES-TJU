name: Deploy TJU-ThermoHub to GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Validate site source and numerical engines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          assert "<!doctype html>" in html.lower(), "Missing HTML5 doctype"
          for page_id in ("p-home", "p-m1", "p-m2", "p-m3", "p-m4", "p-app"):
              assert f'id="{page_id}"' in html, f"Missing page {page_id}"
          for forbidden_runtime in ("supabase-js", "supabase.co", "createClient("):
              assert forbidden_runtime not in html, f"Unexpected live backend integration: {forbidden_runtime}"
          for required in ("assets/vendor/iapws97-browser.js", "assets/js/steam/full.js", "assets/js/eos/lee-kesler.js", "assets/js/r134a/helmholtz.js"):
              assert Path(required).is_file(), f"Missing required offline engine: {required}"
              assert f'src="{required}"' in html, f"Missing script reference: {required}"
          scripts = re.findall(r"<script>([\s\S]*?)</script>", html, re.I)
          assert scripts, "Inline application script not found"
          Path("/tmp/tju-thermohub-app.js").write_text(scripts[-1], encoding="utf-8")
          print("HTML structure, offline engine files and no-live-Supabase constraints validated.")
          PY
          node --check /tmp/tju-thermohub-app.js
          node --check assets/vendor/iapws97-browser.js
          node --check assets/js/steam/full.js
          node --check assets/js/eos/mixture.js
          node --check assets/js/eos/lee-kesler.js\n          node --check assets/js/r134a/helmholtz.js
          node --check assets/js/r134a/helmholtz.js
          node tests/if97-smoke.js
          node tests/mixture-smoke.js
          node tests/lee-kesler-smoke.js
          node tests/coexistence-smoke.js\n          node tests/r134a-smoke.js
          node tests/r134a-smoke.js

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R assets _site/assets
          cp -R licenses _site/licenses
          touch _site/.nojekyll
          cat > _site/robots.txt <<'EOF'
          User-agent: *
          Allow: /
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
