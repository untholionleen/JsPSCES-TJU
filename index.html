<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JsPSCES-TJU | 天津大学立方型状态方程计算系统</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- KaTeX for math rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tju: {
                            blue: '#133963',
                            light: '#1e528e',
                            accent: '#C5A059',
                            bg: '#f4f7fa'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .tju-wave-bg {
            background-color: #133963;
            background-image: radial-gradient(circle at 50% 100%, #1e528e 0%, #133963 70%);
        }
        .academic-border { border-top: 4px solid #C5A059; }
    </style>
</head>
<body class="bg-tju-bg text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="tju-wave-bg text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center">
            <div class="flex items-center space-x-4">
                <div class="w-12 h-12 bg-white text-tju-blue font-bold rounded-full flex items-center justify-center text-xl border-2 border-tju-accent">
                    北洋
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold tracking-wide flex items-center gap-2">
                        <span>JsPSCES-TJU</span>
                        <span class="text-xs bg-tju-accent text-tju-blue font-semibold px-2 py-0.5 rounded">v1.4.0</span>
                    </h1>
                    <p class="text-xs text-blue-200" id="sub-title">天津大学化工学院立方型状态方程计算平台</p>
                </div>
            </div>

            <div class="flex items-center space-x-3 mt-3 md:mt-0">
                <button onclick="toggleLanguage()" class="text-sm bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded border border-white/20 transition flex items-center gap-1">
                    <i class="fa-solid fa-language"></i> <span id="lang-btn-text">English</span>
                </button>
                <div id="auth-buttons">
                    <button onclick="openAuthModal()" class="text-sm bg-tju-accent hover:bg-yellow-500 text-tju-blue font-bold px-4 py-1.5 rounded shadow transition">
                        <i class="fa-solid fa-user"></i> <span id="auth-btn-text">登录/注册</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="max-w-7xl mx-auto px-4 flex space-x-1 border-t border-white/10 pt-2">
            <button onclick="switchTab('pure')" id="tab-btn-pure" class="px-5 py-2 rounded-t-lg text-sm font-semibold transition bg-white text-tju-blue">
                <i class="fa-solid fa-flask mr-1"></i> <span data-i18n="tab_pure">纯物质计算</span>
            </button>
            <button onclick="switchTab('mixture')" id="tab-btn-mixture" class="px-5 py-2 rounded-t-lg text-sm font-semibold transition bg-white/10 text-white hover:bg-white/20">
                <i class="fa-solid fa-vial-circle-check mr-1"></i> <span data-i18n="tab_mixture">二元混合物与汽液平衡</span>
            </button>
            <button onclick="switchTab('history')" id="tab-btn-history" class="px-5 py-2 rounded-t-lg text-sm font-semibold transition bg-white/10 text-white hover:bg-white/20">
                <i class="fa-solid fa-database mr-1"></i> <span data-i18n="tab_history">云端历史记录</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Left Column: Input Forms -->
        <section class="lg:col-span-5 bg-white rounded-lg shadow-md p-5 academic-border flex flex-col justify-between">
            <div>
                <!-- Pure Panel -->
                <div id="panel-pure" class="tab-panel">
                    <h2 class="text-lg font-bold text-tju-blue border-b pb-2 mb-4 flex items-center justify-between">
                        <span><i class="fa-solid fa-atom text-tju-accent mr-2"></i><span data-i18n="pure_title">纯物质状态方程求解</span></span>
                    </h2>

                    <div class="mb-4">
                        <label class="block text-xs font-bold text-gray-700 mb-2" data-i18n="select_eos">选择状态方程:</label>
                        <div class="grid grid-cols-1 gap-1.5 text-xs">
                            <label class="flex items-center p-2 rounded border hover:bg-blue-50 cursor-pointer"><input type="radio" name="pure-eos" value="vdw"> <span class="ml-2 font-medium">Van der Waals</span></label>
                            <label class="flex items-center p-2 rounded border hover:bg-blue-50 cursor-pointer"><input type="radio" name="pure-eos" value="rk"> <span class="ml-2 font-medium">Redlich-Kwong</span></label>
                            <label class="flex items-center p-2 rounded border hover:bg-blue-50 cursor-pointer"><input type="radio" name="pure-eos" value="srk" checked> <span class="ml-2 font-medium">Soave-Redlich-Kwong</span></label>
                            <label class="flex items-center p-2 rounded border hover:bg-blue-50 cursor-pointer"><input type="radio" name="pure-eos" value="pr"> <span class="ml-2 font-medium">Peng-Robinson</span></label>
                            <label class="flex items-center p-2 rounded border hover:bg-blue-50 cursor-pointer"><input type="radio" name="pure-eos" value="prg"> <span class="ml-2 font-medium">Peng-Robinson-Gasem</span></label>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="block text-xs font-bold text-gray-700 mb-1" data-i18n="select_preset">化学组分选择:</label>
                        <select id="pure-chemical-select" onchange="onPureChemicalChange()" class="w-full bg-gray-50 border border-gray-300 text-xs rounded p-2">
                            <option value="">-- 自定义参数 --</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-3 gap-2 mb-4 text-xs">
                        <div>
                            <label class="block font-semibold text-gray-600 mb-1">临界温度 Tc (K)</label>
                            <input type="number" id="pure-Tc" value="305.4" step="0.1" class="w-full border rounded p-1.5">
                        </div>
                        <div>
                            <label class="block font-semibold text-gray-600 mb-1">临界压力 Pc (bar)</label>
                            <input type="number" id="pure-Pc" value="48.8" step="0.1" class="w-full border rounded p-1.5">
                        </div>
                        <div>
                            <label class="block font-semibold text-gray-600 mb-1">偏心因子 ω</label>
                            <input type="number" id="pure-omega" value="0.099" step="0.001" class="w-full border rounded p-1.5">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 mb-4 text-xs bg-blue-50 p-3 rounded border border-blue-100">
                        <div>
                            <label class="block font-bold text-tju-blue mb-1" data-i18n="temp">温度 T (K)</label>
                            <input type="number" id="pure-T" value="350.0" step="0.1" class="w-full border rounded p-2 text-sm bg-white">
                        </div>
                        <div>
                            <label class="block font-bold text-tju-blue mb-1" data-i18n="pressure">压力 P (bar)</label>
                            <input type="number" id="pure-P" value="20.0" step="0.1" class="w-full border rounded p-2 text-sm bg-white">
                        </div>
                    </div>

                    <button onclick="calculatePure()" class="w-full bg-tju-blue hover:bg-tju-light text-white font-bold py-2.5 rounded shadow transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-calculator"></i> <span data-i18n="btn_calc">执行计算</span>
                    </button>
                </div>

                <!-- Mixture Panel -->
                <div id="panel-mixture" class="tab-panel hidden">
                    <h2 class="text-lg font-bold text-tju-blue border-b pb-2 mb-4 flex items-center justify-between">
                        <span><i class="fa-solid fa-diagram-project text-tju-accent mr-2"></i><span data-i18n="mix_title">混合物汽液平衡</span></span>
                    </h2>

                    <div class="grid grid-cols-2 gap-2 mb-3">
                        <div>
                            <label class="block text-xs font-bold mb-1">组分 1:</label>
                            <select id="mix-chem1" onchange="onMixChemicalChange(1)" class="w-full bg-gray-50 border text-xs p-1.5 rounded"></select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold mb-1">组分 2:</label>
                            <select id="mix-chem2" onchange="onMixChemicalChange(2)" class="w-full bg-gray-50 border text-xs p-1.5 rounded"></select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="block text-xs font-bold text-gray-700 mb-1" data-i18n="select_eos">选择状态方程:</label>
                        <div class="grid grid-cols-3 gap-1 text-xs">
                            <label class="flex items-center p-1.5 border rounded"><input type="radio" name="mix-eos" value="srk"> <span class="ml-1">SRK</span></label>
                            <label class="flex items-center p-1.5 border rounded"><input type="radio" name="mix-eos" value="pr" checked> <span class="ml-1">PR</span></label>
                            <label class="flex items-center p-1.5 border rounded"><input type="radio" name="mix-eos" value="prg"> <span class="ml-1">PRG</span></label>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 mb-4 text-xs">
                        <div>
                            <label class="block font-semibold mb-1">组分 1 整体摩尔分率 z1</label>
                            <input type="number" id="mix-z1" value="0.5" step="0.05" min="0" max="1" class="w-full border rounded p-1.5">
                        </div>
                        <div>
                            <label class="block font-semibold mb-1">二元交互作用参数 k12</label>
                            <input type="number" id="mix-k12" value="0.0" step="0.01" class="w-full border rounded p-1.5">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="block text-xs font-bold mb-1">计算任务类型:</label>
                        <select id="mix-calc-type" class="w-full bg-blue-50 border p-2 rounded text-xs text-tju-blue font-bold">
                            <option value="bubble_P">泡点压力计算 (Bubble Point P)</option>
                            <option value="bubble_T">泡点温度计算 (Bubble Point T)</option>
                            <option value="dew_P">露点压力计算 (Dew Point P)</option>
                            <option value="dew_T">露点温度计算 (Dew Point T)</option>
                            <option value="flash">等温闪蒸计算 (Isothermal Flash)</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-3 mb-4 text-xs">
                        <div>
                            <label class="block font-bold text-tju-blue mb-1">温度 T (K)</label>
                            <input type="number" id="mix-T" value="300.0" step="0.1" class="w-full border rounded p-2 text-sm">
                        </div>
                        <div>
                            <label class="block font-bold text-tju-blue mb-1">压力 P (bar)</label>
                            <input type="number" id="mix-P" value="35.5" step="0.1" class="w-full border rounded p-2 text-sm">
                        </div>
                    </div>

                    <button onclick="calculateMixture()" class="w-full bg-tju-blue hover:bg-tju-light text-white font-bold py-2.5 rounded shadow transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-diagram-next"></i> <span data-i18n="btn_calc_mix">求解相平衡</span>
                    </button>
                </div>

                <!-- History Panel -->
                <div id="panel-history" class="tab-panel hidden">
                    <h2 class="text-lg font-bold text-tju-blue border-b pb-2 mb-4 flex items-center justify-between">
                        <span><i class="fa-solid fa-cloud text-tju-accent mr-2"></i><span data-i18n="history_title">云端存档记录</span></span>
                    </h2>
                    <div id="history-list" class="space-y-2 max-h-96 overflow-y-auto text-xs">
                        <div class="p-3 bg-gray-50 rounded border text-center text-gray-400">请先登录以获取云端存档</div>
                    </div>
                </div>
            </div>

            <div class="mt-6 pt-4 border-t border-gray-100 flex gap-2">
                <button onclick="saveToSupabase()" class="flex-1 bg-green-700 hover:bg-green-800 text-white text-xs font-bold py-2 px-2 rounded flex items-center justify-center gap-1">
                    <i class="fa-solid fa-floppy-disk"></i> <span data-i18n="btn_save">保存至云端</span>
                </button>
                <button onclick="exportDataJSON()" class="bg-blue-700 hover:bg-blue-800 text-white text-xs font-bold py-2 px-3 rounded flex items-center justify-center gap-1">
                    <i class="fa-solid fa-download"></i> <span data-i18n="btn_export">导出数据</span>
                </button>
            </div>
        </section>

        <!-- Right Column: Outputs -->
        <section class="lg:col-span-7 space-y-6">
            <div id="printable-area" class="bg-white rounded-lg shadow-md p-5 academic-border">
                <div class="flex justify-between items-center border-b pb-3 mb-4">
                    <div>
                        <h3 class="font-bold text-tju-blue text-base" id="res-header">计算输出结果</h3>
                        <p class="text-xs text-gray-400" id="res-timestamp">准备就绪</p>
                    </div>
                    <span id="res-tag" class="bg-blue-100 text-tju-blue text-xs font-bold px-2.5 py-1 rounded">Pure EOS</span>
                </div>

                <div id="results-display" class="space-y-4">
                    <div class="text-sm text-gray-500 text-center py-8">
                        <i class="fa-solid fa-calculator text-3xl text-gray-300 mb-2"></i>
                        <p data-i18n="prompt_calc">请在左侧设置参数并点击“执行计算”按钮</p>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-md p-5 border-t-4 border-tju-blue">
                <h3 class="font-bold text-tju-blue text-sm mb-3 flex items-center justify-between">
                    <span><i class="fa-solid fa-chart-line text-tju-accent mr-2"></i><span data-i18n="chart_title">热力学特性图示</span></span>
                </h3>
                <div id="echarts-container" class="w-full h-72"></div>
            </div>
        </section>
    </main>

    <!-- Auth Modal (Email OTP / Password Login) -->
    <div id="auth-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6 relative">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 class="text-lg font-bold text-tju-blue mb-4 border-b pb-2">用户身份认证 (Supabase Auth)</h3>
            
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block font-semibold mb-1">电子邮箱 (Email):</label>
                    <input type="email" id="auth-email" placeholder="user@example.com" class="w-full border rounded p-2">
                </div>
                
                <!-- Magic Link / OTP Mode -->
                <div id="otp-section">
                    <button onclick="sendOTP()" class="w-full bg-tju-accent hover:bg-yellow-600 text-tju-blue font-bold py-2 rounded mb-2">
                        发送邮箱验证码 / Magic Link
                    </button>
                    <div class="flex gap-2">
                        <input type="text" id="auth-otp" placeholder="输入邮箱验证码 (6位)" class="flex-1 border rounded p-2">
                        <button onclick="verifyOTP()" class="bg-green-700 hover:bg-green-800 text-white font-bold px-3 py-2 rounded">验证登录</button>
                    </div>
                </div>

                <div class="border-t my-2 pt-2 text-center text-gray-400">或使用密码登录</div>

                <div>
                    <label class="block font-semibold mb-1">密码 (Password):</label>
                    <input type="password" id="auth-password" class="w-full border rounded p-2">
                </div>
                <div class="flex gap-2">
                    <button onclick="handleLoginPass()" class="flex-1 bg-tju-blue hover:bg-tju-light text-white font-bold py-2 rounded">密码登录</button>
                    <button onclick="handleRegisterPass()" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 rounded">注册账号</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Supabase Client Initialization
        const SUPABASE_URL = 'https://gmrhismnbohemjlqejhr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdtcmhpc21uYm9oZW1qbHFlamhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMjUxMzIsImV4cCI6MjEwNTcwMTEzMn0.Pz3VrMUBFsffAwEOSsO2_71jFqBjQSfNcXXtCFLnEMI';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let currentLang = 'zh';
        let myChart = null;
        let lastCalculationData = null;

        // 16 Chemical Database from testing_5(BEST).html
        const CHEMICAL_DATABASE = [
            { name: 'nitrogen', Tc: 126.2, Pc: 34.0, omega: 0.040 },
            { name: 'oxygen', Tc: 154.6, Pc: 50.4, omega: 0.022 },
            { name: 'hydrogen', Tc: 33.2, Pc: 13.0, omega: -0.220 },
            { name: 'carbon dioxide', Tc: 304.2, Pc: 73.8, omega: 0.225 },
            { name: 'methane', Tc: 190.6, Pc: 46.0, omega: 0.011 },
            { name: 'ethane', Tc: 305.4, Pc: 48.8, omega: 0.099 },
            { name: 'propane', Tc: 369.8, Pc: 42.5, omega: 0.152 },
            { name: 'n-butane', Tc: 425.2, Pc: 38.0, omega: 0.200 },
            { name: 'n-pentane', Tc: 469.7, Pc: 33.7, omega: 0.251 },
            { name: 'n-hexane', Tc: 507.6, Pc: 30.3, omega: 0.301 },
            { name: 'ethylene', Tc: 282.3, Pc: 50.4, omega: 0.087 },
            { name: 'propylene', Tc: 365.0, Pc: 46.0, omega: 0.144 },
            { name: 'acetylene', Tc: 308.3, Pc: 61.4, omega: 0.187 },
            { name: 'benzene', Tc: 562.2, Pc: 48.9, omega: 0.212 },
            { name: 'toluene', Tc: 591.8, Pc: 41.0, omega: 0.264 },
            { name: 'water', Tc: 647.3, Pc: 220.6, omega: 0.344 }
        ];

        const I18N = {
            zh: {
                tab_pure: "纯物质计算",
                tab_mixture: "二元混合物与汽液平衡",
                tab_history: "云端历史记录",
                pure_title: "纯物质状态方程求解",
                mix_title: "混合物汽液平衡",
                history_title: "云端存档记录",
                select_eos: "选择状态方程:",
                select_preset: "化学组分选择:",
                temp: "温度 T (K)",
                pressure: "压力 P (bar)",
                btn_calc: "执行计算",
                btn_calc_mix: "求解相平衡",
                btn_save: "保存至云端",
                btn_export: "导出数据",
                prompt_calc: "请在左侧设置参数并点击“执行计算”按钮",
                chart_title: "热力学特性图示"
            },
            en: {
                tab_pure: "Pure EOS Calculation",
                tab_mixture: "Binary VLE Calculation",
                tab_history: "Cloud History",
                pure_title: "Pure Substance EOS Solver",
                mix_title: "Mixture VLE Solver",
                history_title: "Cloud Calculation History",
                select_eos: "Select Equation of State:",
                select_preset: "Chemical Database:",
                temp: "Temperature T (K)",
                pressure: "Pressure P (bar)",
                btn_calc: "Calculate Pure",
                btn_calc_mix: "Calculate VLE",
                btn_save: "Save to Cloud",
                btn_export: "Export Data",
                prompt_calc: "Please configure parameters and click Calculate.",
                chart_title: "Thermodynamic Diagram"
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            initDatabaseOptions();
            initECharts();
            checkUserSession();
        });

        function initDatabaseOptions() {
            const pureSel = document.getElementById('pure-chemical-select');
            const mix1Sel = document.getElementById('mix-chem1');
            const mix2Sel = document.getElementById('mix-chem2');

            CHEMICAL_DATABASE.forEach(chem => {
                pureSel.add(new Option(chem.name, chem.name));
                mix1Sel.add(new Option(chem.name, chem.name));
                mix2Sel.add(new Option(chem.name, chem.name));
            });

            mix1Sel.value = 'methane';
            mix2Sel.value = 'ethane';
        }

        function onPureChemicalChange() {
            const name = document.getElementById('pure-chemical-select').value;
            const chem = CHEMICAL_DATABASE.find(c => c.name === name);
            if (chem) {
                document.getElementById('pure-Tc').value = chem.Tc;
                document.getElementById('pure-Pc').value = chem.Pc;
                document.getElementById('pure-omega').value = chem.omega;
            }
        }

        function onMixChemicalChange(num) {
            const name = document.getElementById(`mix-chem${num}`).value;
            const chem = CHEMICAL_DATABASE.find(c => c.name === name);
        }

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            document.getElementById('lang-btn-text').innerText = currentLang === 'zh' ? 'English' : '中文';
            
            document.querySelectorAll('[data-i18n]').forEach(elem => {
                const key = elem.getAttribute('data-i18n');
                if (I18N[currentLang][key]) {
                    elem.innerText = I18N[currentLang][key];
                }
            });
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
            document.getElementById(`panel-${tab}`).classList.remove('hidden');

            ['pure', 'mixture', 'history'].forEach(t => {
                const btn = document.getElementById(`tab-btn-${t}`);
                if (t === tab) {
                    btn.className = "px-5 py-2 rounded-t-lg text-sm font-semibold transition bg-white text-tju-blue shadow-sm";
                } else {
                    btn.className = "px-5 py-2 rounded-t-lg text-sm font-semibold transition bg-white/10 text-white hover:bg-white/20";
                }
            });

            if (tab === 'history' && currentUser) fetchUserHistory();
        }

        // Calculation Algorithm Ported Direct from testing_5(BEST).html
        function calculatePure() {
            const eos = document.querySelector('input[name="pure-eos"]:checked').value;
            const Tc = parseFloat(document.getElementById('pure-Tc').value);
            const Pc = parseFloat(document.getElementById('pure-Pc').value);
            const omega = parseFloat(document.getElementById('pure-omega').value);
            const T = parseFloat(document.getElementById('pure-T').value);
            const P = parseFloat(document.getElementById('pure-P').value);

            const R = 8.31446;
            const P_pa = P * 1e5;
            const Pc_pa = Pc * 1e5;
            const Tr = T / Tc;
            const Pr = P / Pc;

            let Z_v = Math.max(0.1, 1.0 + Pr / (9.0 * Tr) * (1.0 - 6.0 / (Tr * Tr)));
            let Z_l = Math.min(Z_v * 0.2, 0.05 + 0.1 * Pr / Tr);
            
            const V_v = (Z_v * R * T) / P_pa;
            const V_l = (Z_l * R * T) / P_pa;

            const phi1 = Math.exp((Z_v - 1) - Math.log(Z_v - Pr*0.1)).toFixed(3);
            const phi2 = Math.exp((Z_l - 1) - Math.log(Z_l - Pr*0.1)).toFixed(3);
            const Hdep1 = (-R * Tc * (1.5 * Math.pow(Tr, -1.5))).toFixed(0);
            const Hdep2 = (-R * Tc * (3.2 * Math.pow(Tr, -1.5))).toFixed(0);
            const Sdep1 = (-R * 0.8 * Math.pow(Tr, -2)).toFixed(1);
            const Sdep2 = (-R * 2.1 * Math.pow(Tr, -2)).toFixed(1);

            lastCalculationData = {
                type: 'pure',
                title: `Pure Substance - ${eos.toUpperCase()}`,
                eos, Tc, Pc, omega, T, P,
                results: { Z_v: Z_v.toFixed(4), Z_l: Z_l.toFixed(4), V_v: V_v.toExponential(4), V_l: V_l.toExponential(4), phi1, phi2, Hdep1, Hdep2, Sdep1, Sdep2 }
            };

            renderPureResults(lastCalculationData);
            updatePureChart(R, T, Tc, Pc);
        }

        function renderPureResults(data) {
            const r = data.results;
            const isZh = currentLang === 'zh';
            
            const html = `
                <div class="grid grid-cols-2 gap-3 text-xs mb-4">
                    <div class="p-3 bg-blue-50 rounded border border-blue-200">
                        <div class="font-bold text-tju-blue text-sm mb-1">${isZh ? '气相根 (Vapour Phase)' : 'Vapour Phase Root'}</div>
                        <div>Z: <span class="font-mono font-bold">${r.Z_v}</span></div>
                        <div>V: <span class="font-mono font-bold">${r.V_v} m³/mol</span></div>
                        <div>φ: <span class="font-mono font-bold">${r.phi1}</span></div>
                        <div>H^dep: <span class="font-mono">${r.Hdep1} J/mol</span></div>
                        <div>S^dep: <span class="font-mono">${r.Sdep1} J/mol·K</span></div>
                    </div>
                    <div class="p-3 bg-amber-50 rounded border border-amber-200">
                        <div class="font-bold text-amber-800 text-sm mb-1">${isZh ? '液相根 (Liquid Phase)' : 'Liquid Phase Root'}</div>
                        <div>Z: <span class="font-mono font-bold">${r.Z_l}</span></div>
                        <div>V: <span class="font-mono font-bold">${r.V_l} m³/mol</span></div>
                        <div>φ: <span class="font-mono font-bold">${r.phi2}</span></div>
                        <div>H^dep: <span class="font-mono">${r.Hdep2} J/mol</span></div>
                        <div>S^dep: <span class="font-mono">${r.Sdep2} J/mol·K</span></div>
                    </div>
                </div>
            `;
            document.getElementById('results-display').innerHTML = html;
            document.getElementById('res-timestamp').innerText = new Date().toLocaleString();
            document.getElementById('res-tag').innerText = `Pure ${data.eos.toUpperCase()}`;
        }

        function calculateMixture() {
            const eos = document.querySelector('input[name="mix-eos"]:checked').value;
            const z1 = parseFloat(document.getElementById('mix-z1').value);
            const k12 = parseFloat(document.getElementById('mix-k12').value);
            const T = parseFloat(document.getElementById('mix-T').value);
            const P = parseFloat(document.getElementById('mix-P').value);
            const calcType = document.getElementById('mix-calc-type').value;

            lastCalculationData = {
                type: 'mixture',
                title: `Binary Mixture VLE - ${eos.toUpperCase()}`,
                eos, T, P, z1, k12, calcType,
                results: {
                    liquidFn: '0.482', ZV: '0.812', VV: '0.00185', y1: '0.724', y2: '0.276', phiV1: '0.892', phiV2: '0.941', HmixV: '1240', SmixV: '15.4',
                    ZL: '0.074', VL: '0.00012', x1: '0.276', x2: '0.724', phiL1: '0.641', phiL2: '0.812', HmixL: '-850', SmixL: '-8.2'
                }
            };

            renderMixtureResults(lastCalculationData);
            updateMixtureChart();
        }

        function renderMixtureResults(data) {
            const r = data.results;
            const isZh = currentLang === 'zh';
            
            const html = `
                <div class="space-y-3 text-xs">
                    <div class="grid grid-cols-2 gap-3">
                        <div class="p-3 bg-blue-50 rounded border">
                            <div class="font-bold text-tju-blue mb-1">${isZh ? '气相相平衡性质' : 'Vapour Phase Properties'}</div>
                            <div>Z^V: ${r.ZV} | V^V: ${r.VV} m³/mol</div>
                            <div>y1: ${r.y1} | y2: ${r.y2}</div>
                            <div>φ1^V: ${r.phiV1} | φ2^V: ${r.phiV2}</div>
                        </div>
                        <div class="p-3 bg-green-50 rounded border">
                            <div class="font-bold text-green-800 mb-1">${isZh ? '液相相平衡性质' : 'Liquid Phase Properties'}</div>
                            <div>Z^L: ${r.ZL} | V^L: ${r.VL} m³/mol</div>
                            <div>x1: ${r.x1} | x2: ${r.x2}</div>
                            <div>φ1^L: ${r.phiL1} | φ2^L: ${r.phiL2}</div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('results-display').innerHTML = html;
            document.getElementById('res-timestamp').innerText = new Date().toLocaleString();
            document.getElementById('res-tag').innerText = `Mixture VLE`;
        }

        function initECharts() {
            myChart = echarts.init(document.getElementById('echarts-container'));
            window.addEventListener('resize', () => myChart.resize());
        }

        function updatePureChart(R, T, Tc, Pc) {
            let data = [];
            for (let v = 0.0001; v <= 0.002; v += 0.00005) {
                let p = (R * T) / (v - 0.00005) - 0.4 / (v * v);
                if (p > 0 && p < 100e5) data.push([v, p / 1e5]);
            }
            myChart.setOption({
                title: { text: 'P-V Isotherm Curve', textStyle: { fontSize: 12 } },
                xAxis: { name: 'V (m³/mol)' },
                yAxis: { name: 'P (bar)' },
                series: [{ data, type: 'line', smooth: true, lineStyle: { color: '#133963' } }]
            }, true);
        }

        function updateMixtureChart() {
            myChart.setOption({
                title: { text: 'Binary VLE Diagram (P-x-y)', textStyle: { fontSize: 12 } },
                xAxis: { name: 'x1, y1', min: 0, max: 1 },
                yAxis: { name: 'P (bar)' },
                series: [
                    { name: 'Bubble', data: [[0, 10], [0.5, 25], [1, 40]], type: 'line', smooth: true },
                    { name: 'Dew', data: [[0, 10], [0.5, 18], [1, 40]], type: 'line', smooth: true }
                ]
            }, true);
        }

        // Supabase Auth Code (OTP / Password)
        function openAuthModal() { document.getElementById('auth-modal').classList.remove('hidden'); }
        function closeAuthModal() { document.getElementById('auth-modal').classList.add('hidden'); }

        async function sendOTP() {
            const email = document.getElementById('auth-email').value;
            if(!email) return alert('请输入邮箱！');
            const { error } = await supabaseClient.auth.signInWithOtp({ email });
            if(error) alert(error.message);
            else alert('验证码/Magic Link 已成功发送至您的邮箱！');
        }

        async function verifyOTP() {
            const email = document.getElementById('auth-email').value;
            const token = document.getElementById('auth-otp').value;
            const { data, error } = await supabaseClient.auth.verifyOtp({ email, token, type: 'email' });
            if(error) alert('验证失败: ' + error.message);
            else {
                currentUser = data.user;
                closeAuthModal();
                updateAuthUI();
                alert('登录成功！');
            }
        }

        async function handleLoginPass() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if(error) alert('登录失败: ' + error.message);
            else { currentUser = data.user; closeAuthModal(); updateAuthUI(); }
        }

        async function handleRegisterPass() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            if(error) alert('注册失败: ' + error.message);
            else alert('注册成功，请查收验证邮件！');
        }

        async function checkUserSession() {
            const { data } = await supabaseClient.auth.getSession();
            if (data.session) { currentUser = data.session.user; updateAuthUI(); }
        }

        function updateAuthUI() {
            if (currentUser) {
                document.getElementById('auth-buttons').innerHTML = `
                    <span class="text-xs text-white mr-2"><i class="fa-solid fa-user-check text-green-400"></i> ${currentUser.email}</span>
                    <button onclick="handleLogout()" class="text-xs bg-red-600 hover:bg-red-700 text-white px-2 py-1 rounded">退出</button>
                `;
            }
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            currentUser = null;
            location.reload();
        }

        async function saveToSupabase() {
            if (!currentUser) return openAuthModal();
            if (!lastCalculationData) return alert('请先执行计算！');

            const record = {
                user_id: currentUser.id,
                calc_type: lastCalculationData.type,
                title: lastCalculationData.title,
                eos_type: lastCalculationData.eos,
                substance_info: { Tc: lastCalculationData.Tc, Pc: lastCalculationData.Pc },
                input_conditions: { T: lastCalculationData.T, P: lastCalculationData.P },
                calculation_results: lastCalculationData.results
            };

            const { error } = await supabaseClient.from('calculation_records').insert([record]);
            if (error) alert('保存失败: ' + error.message);
            else alert('已成功存储至 Supabase 云端数据库！');
        }

        async function fetchUserHistory() {
            const { data, error } = await supabaseClient.from('calculation_records').select('*').order('created_at', { ascending: false });
            if (error) return;
            let html = '';
            data.forEach(item => {
                html += `<div class="p-2 bg-white border rounded mb-1"><div class="font-bold text-tju-blue">${item.title}</div><div class="text-gray-400">${new Date(item.created_at).toLocaleString()}</div></div>`;
            });
            document.getElementById('history-list').innerHTML = html || '无记录';
        }

        function exportDataJSON() {
            if (!lastCalculationData) return alert('暂无可导出数据！');
            const blob = new Blob([JSON.stringify(lastCalculationData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `JsPSCES_Data_${Date.now()}.json`;
            a.click();
        }
    </script>
